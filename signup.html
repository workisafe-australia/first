<form id="signupForm">

    <label>メールアドレス</label>

        type="email"
        id="email"
        placeholder="example@email.com"

        type="password"
        id="password"
        placeholder="6文字以上"
        required>

    <button type="submit">
        新規登録
    </button>

</form>
